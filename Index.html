<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./CSS/Styles.css">
    <script src="./JS/app.js" defer></script>
</head>

<body>
    <div id="content-box">
        <!-- Left side, display pokemon info -->
        <div id="pokemon-info">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" id="pokemon-img">
            <div id="pokemon-types">
                <span class="type-box grass">GRASS</span><span class="type-box poison">POISON</span>
            </div>
            <div id="pokemon-description"></div>
        </div>
        <!-- Right side, display pokemon list -->
        <div id="pokemon-list"></div>
    </div>
</body>

</html>
